spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:rikkeiacademy}
      timeout: 2000ms
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Route 1: /identity/** → identity-service (port 8080)
            # StripPrefix=1 loại bỏ /identity trước khi forward
            # Ví dụ: /identity/api/v1/auth/login → /api/v1/auth/login
            - id: identity-service-route
              uri: http://localhost:8080
              predicates:
                - Path=/identity/**
              filters:
                - StripPrefix=1

            # Route 2: /api/courses/** → course-service (port 8082)
            - id: course-service-direct-route
              uri: http://localhost:8082
              predicates:
                - Path=/api/courses/**

            # Route 3: /api/auth/**, /api/v1/auth/** → identity-service (port 8080)
            - id: identity-service-direct-route
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/auth/**, /api/auth/**

server:
  port: 8888

# JWT config — copy từ identity-service để Gateway tự validate token
jwt:
  secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  # Danh sách các path được bỏ qua kiểm tra JWT (whitelist)
  # AntPath pattern: bao gồm /login, /register, /refresh, /logout
  whitelist-paths:
    - /identity/api/v1/auth/**
    - /identity/api/auth/**
    - /api/v1/auth/**
    - /api/auth/**

logging:
  level:
    com.example.apigateway: DEBUG